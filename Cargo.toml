[workspace]
members = [
    "crates/common",
    "crates/core",
    "crates/frontend",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
common = { path = "crates/common" }
emu-core = { path = "crates/core" }
thiserror = "2.0"
